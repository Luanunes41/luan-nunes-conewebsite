<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cone</title>
  <link rel="icon" type="image/png" href="img/logo-nav.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/palette.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsividade.css">
</head>
<body>

  <header class="navbar" id="navbar">
    <div class="navbar__container">
      <a href="#inicio" class="navbar__logo" aria-label="Cone - página inicial">
        <img src="img/logo-nav-light.png" alt="Cone">
      </a>

      <nav class="navbar__menu" id="navbar-menu" aria-label="Menu principal">
        <ul class="navbar__links">
          <li><a href="#inicio" class="navbar__link active">Início</a></li>
          <li><a href="#sobre" class="navbar__link">Sobre</a></li>
          <li><a href="#servicos" class="navbar__link">Serviços</a></li>
          <li><a href="#contato" class="navbar__link">Contato</a></li>
        </ul>
        <a href="#contato" class="btn btn--accent navbar__cta">Fale conosco</a>
      </nav>

      <button class="navbar__toggle" id="navbar-toggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="navbar-menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <main>
    <section id="inicio" class="hero">
      <!-- Camada de efeitos alinhada ao ícone do HubSpot da imagem de fundo (posicionada via js/main.js) -->
      <div class="hero__fx" aria-hidden="true">
        <div class="hero__icon">
          <span class="hero__icon-glow"></span>
          <span class="hero__icon-ring"></span>
          <span class="hero__icon-ring"></span>
          <span class="hero__icon-shine"></span>
        </div>
      </div>

      <div class="hero__container">
        <div class="hero__content">
          <h1 class="hero__title">Transformamos seu HubSpot em um <span>motor de crescimento.</span></h1>
          <p class="hero__subtitle">Arquitetura, automação e capacitação para conectar processos, potencializar equipes e gerar resultados reais.</p>
          <div class="hero__actions">
            <a href="#contato" class="btn btn--accent">Fale conosco</a>
            <a href="#sobre" class="btn btn--ghost">Saiba mais</a>
          </div>
        </div>
      </div>
    </section>

    <!-- Seções provisórias, só para os links do menu funcionarem -->
    <section id="sobre" class="section"><h2>Sobre</h2></section>
    <section id="servicos" class="section"><h2>Serviços</h2></section>
    <section id="contato" class="section"><h2>Contato</h2></section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
